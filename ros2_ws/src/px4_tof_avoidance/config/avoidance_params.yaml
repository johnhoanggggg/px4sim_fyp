# Obstacle avoidance parameters
tof_aggregator:
  ros__parameters:
    max_range: 2.0
    min_range: 0.30
    publish_rate: 10.0

avoidance:
  ros__parameters:
    algorithm: 'fgm3d'
    max_speed: 0.5
    max_range: 2.0
    safe_distance: 1.0
    bubble_radius: 0.35
    waypoint_tolerance: 0.6
    control_rate: 10.0
    vel_smooth: 0.3
