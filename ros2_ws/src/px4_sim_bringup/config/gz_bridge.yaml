# ros_gz_bridge topic mappings
# Bridges Gazebo Harmonic topics to ROS2 for ToF sensors, OAK-D Lite camera, and IMU
#
# Usage:
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=<path>/gz_bridge.yaml

# --- ToF Sensors (12x gpu_lidar → LaserScan) ---
- topic_name: /tof/0
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

- topic_name: /tof/1
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

